#
# Static Site CI — custom Nuxt status site (replaces the Upptime Svelte site).
# Bakes monitoring data at build time, deploys to gh-pages (status.shotium.com).
# Rebuild cadence: daily + manual dispatch + pushes touching site code.
#

name: Static Site CI
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/site.yml"
concurrency:
  group: ${{ github.repository }}-static-site
  cancel-in-progress: true
jobs:
  build-deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Bake status data
        run: node scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npx nuxt generate
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: site/.output/public
          # gh-pages history has no value; keep it a single commit
          force_orphan: true
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
