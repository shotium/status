name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          # Configure the secret allowlist in .upptimerc.yml; do not edit this workflow directly.
          SECRETS_CONTEXT: '{}'
      # Custom: rebuild the status site promptly when a status flips (baked
      # data is otherwise refreshed daily). Needs GH_PAT — GITHUB_TOKEN
      # dispatches don't trigger workflow runs.
      - name: Rebuild site on status change
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if git log --since="12 minutes ago" --format=%s | grep -qE ' is (up|down|degraded) \('; then
            echo "Status change detected, dispatching Static Site CI"
            gh workflow run "Static Site CI" --repo "$GITHUB_REPOSITORY" || true
          fi
