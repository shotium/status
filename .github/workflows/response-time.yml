#
# Response Time CI — daily forced snapshot (update with shouldCommit=true).
# Without this, uptime.yml only commits on status *changes*, so summary.json
# (uptime %, response times) would freeze during long incident-free periods.
# Engine pinned; template auto-updates are disabled in this repo.
#

name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Daily data snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: '{}'
