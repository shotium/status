# Shotium status monitoring — data core only.
# The status site UI is our own Nuxt app in site/ (see Static Site CI);
# Upptime's status-website/i18n options no longer apply.
# Upptime template auto-updates are disabled (updates/update-template workflows removed);
# uptime-monitor is pinned in .github/workflows/uptime.yml.
owner: shotium
repo: status
user-agent: shotium

# Strict allowlist: uptime checks use no contextual secrets (GH_PAT is passed separately)
secrets: []

sites:
  - name: Website & Dashboard
    url: https://shotium.com/api/health
    slug: shotium-com
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: API
    url: https://api.shotium.com/v1/screenshot
    slug: api-shotium-com
    # Unauthenticated request must reach the auth layer and return 401,
    # proving edge + routing + auth middleware are alive
    expectedStatusCodes:
      - 401

# Keep repo metadata under our control
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

# Never delete short-lived incident issues (default deletes issues resolved
# within 15 min) — every incident stays on the record
skipDeleteIssues: true
