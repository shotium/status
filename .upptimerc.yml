# Shotium public status page — https://status.shotium.com
owner: shotium
repo: status
user-agent: shotium

# Strict allowlist: uptime checks use no contextual secrets (GH_PAT is passed separately)
secrets: []

sites:
  - name: Website & Dashboard
    url: https://shotium.com/api/health
    slug: shotium-com
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: API
    url: https://api.shotium.com/v1/screenshot
    slug: api-shotium-com
    # Unauthenticated request must reach the auth layer and return 401,
    # proving edge + routing + auth middleware are alive
    expectedStatusCodes:
      - 401

status-website:
  cname: status.shotium.com
  name: Shotium Status
  themeUrl: https://status.shotium.com/shotium-theme.css
  logoUrl: https://shotium.com/brand/shotium-mark-white.svg
  favicon: https://shotium.com/favicon-96x96.png
  faviconSvg: https://shotium.com/favicon.svg
  customHeadHtml: '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">'
  # Banner emoji is hardcoded in the template outside i18n; strip it at runtime, theme CSS draws its own status dot
  js: >-
    new MutationObserver(function () {
      document.querySelectorAll("main article").forEach(function (a) {
        a.childNodes.forEach(function (n) {
          if (n.nodeType === 3 && /[\u2705\u26a0\ufe0f\ud83d\uded1]/.test(n.textContent)) {
            n.textContent = n.textContent.replace(/[\u2705\u26a0\ufe0f\ud83d\uded1\u00a0]+\s*/g, "");
          }
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  introTitle: "**Shotium** service status"
  introMessage: Live uptime and response times for [shotium.com](https://shotium.com), checked every ~5 minutes from GitHub Actions. All history is stored as public git commits in [this repository](https://github.com/shotium/status) — fully auditable.
  navbar:
    - title: Status
      href: /
    - title: shotium.com
      href: https://shotium.com
    - title: Docs
      href: https://shotium.com/docs
    - title: Feedback
      href: https://github.com/shotium/feedback

# Emoji-free status strings; the theme CSS draws its own status dot
i18n:
  allSystemsOperational: All systems are operational
  degradedPerformance: Degraded performance
  partialOutage: Partial outage
  completeOutage: Complete outage
